name: Daily digest

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 07:00 Africa/Kigali
  workflow_dispatch:

permissions:
  contents: write

# Shared with alerts.yml so two runs can never write state at once.
concurrency:
  group: newsbot-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Send digest
        timeout-minutes: 4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m newsbot run --mode digest

      - name: Commit state
        if: always()
        run: scripts/commit_state.sh
